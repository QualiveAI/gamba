# Инфраструктура WINDROP как код для Render (Blueprint).
# Секретов здесь нет: sync: false означает ручной ввод в dashboard, generateValue
# создаёт случайное значение сам Render и показывает его один раз.
#
# PostgreSQL берётся внешний (Neon): Render free Postgres удаляется по retention,
# поэтому databases: отсутствует, а DATABASE_URL вводится вручную.
# Region согласован с Neon (Ohio), иначе каждый запрос к БД добавляет RTT.
#
# Схема Render Blueprint: repo — строка URL, branch — отдельное поле, контекст
# сборки называется dockerContext, а группа переменных подключается через
# envVars: - fromGroup (поля repo:{...}, dockerBuildContext и envVarGroups
# внутри сервиса схемой не являются).

envVarGroups:
  - name: windrop-backend-env
    envVars:
      - key: ENV
        value: prod
      - key: BOT_MODE
        value: webhook
      - key: MANAGED_BOTS_ENABLED
        value: "true"
      - key: ALLOW_GUEST_AUTH
        value: "false"
      - key: PAYMENTS_MODE
        value: disabled
      - key: PAYMENT_WEB_ENABLED
        value: "false"
      - key: GIFTCARD_MODE
        value: disabled
      - key: GIFTCARD_REDEMPTION_ENABLED
        value: "false"
      - key: MEDIA_STORAGE_MODE
        value: local
      # Событийный worker: не опрашивать Neon вхолостую, чтобы compute засыпал.
      - key: BOT_WORKER_EVENT_WAIT
        value: "true"
      - key: BOT_WORKER_RESCAN_SECONDS
        value: "300"
      # Free-лимиты соединений: API 3 + worker 3 + scheduler 1.
      - key: DB_POOL_MIN_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: BOT_USERNAME
        value: robwindropbot
      - key: DATABASE_URL
        sync: false # Neon DIRECT endpoint (не -pooler): scheduler держит advisory lock
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL
      - key: BOT_TOKEN
        sync: false # только после revoke в @BotFather
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      # Адрес публичного API. Нужен и web-сервису, и cron: cron не имеет своего
      # URL, поэтому берёт этот, чтобы поставить webhook на windrop-api.
      - key: PUBLIC_BASE_URL
        sync: false # https://windrop-api.onrender.com
      - key: WEBAPP_URL
        sync: false # https://<vercel-domain>/app/
      - key: CORS_ALLOW_ORIGINS
        sync: false # https://<vercel-domain> без пути и слэша
      - key: FERNET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

services:
  # Один сервис держит API + bot worker + scheduler: Render free даёт ~750 ч/мес
  # на аккаунт, отдельные worker/scheduler удвоили бы потребление.
  - type: web
    name: windrop-api
    runtime: docker
    plan: free
    region: ohio
    repo: https://github.com/QualiveAI/gamba
    branch: main
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: windrop-backend-env

  # У free-плана нет Shell, поэтому provisioning webhook выполняется этим job.
  # `python -m app.bot.main` идемпотентен: upsert registry + setWebhook, без
  # удаления updates и без polling. Запуск раз в сутки восстанавливает webhook,
  # если его перебили извне; стоит секунды instance-time.
  - type: cron
    name: windrop-provision-webhook
    runtime: docker
    plan: free
    region: ohio
    schedule: "0 5 * * *"
    repo: https://github.com/QualiveAI/gamba
    branch: main
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m app.bot.main
    envVars:
      - fromGroup: windrop-backend-env
