[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-case-platform"
version = "0.1.0"
description = "Roblox Telegram Mini App case platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "aiogram>=3.10",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "cryptography>=43.0",
  "pyyaml>=6.0",
  "qrcode[pil]>=7.4",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]