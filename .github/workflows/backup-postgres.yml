name: Backup PostgreSQL

# Render/Neon free не делают управляемых резервных копий и удаляют ресурсы по
# истечении retention. Дамп берётся в облачном runner (не с ПК оператора),
# шифруется age и уезжает за пределы провайдера БД.
#
# Основное хранилище — артефакт GitHub Actions: не требует карты и новых
# аккаунтов. Дополнительно: если заданы секреты R2, тот же шифротекст уходит
# в Cloudflare R2 (R2 включается только из dashboard, API отвечает code 10042).
#
# Обязательные GitHub Secrets:
#   DATABASE_URL_PROD    — DSN с паролем, поэтому именно secret, не variable
#   AGE_PRIVATE_KEY      — приватная часть age-ключа (нужна restore-drill)
# Обязательные GitHub Variables:
#   AGE_RECIPIENT_PUBLIC — публичная часть age-ключа (ssh-ed25519 …)
# Необязательные Secrets (для R2):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#
# infra/backup.sh остаётся путём оператора с pg_service; в CI DSN приходит
# строкой, поэтому дамп делается inline с той же дисциплиной: plaintext на диск
# не пишется, ошибка любой стадии даёт exit 1, частичный файл не перезаписывается.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-postgres
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEST: /tmp/windrop-latest.dump.age
      # В if: нельзя ссылаться на secrets, поэтому пробрасываем в env.
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age curl ca-certificates gnupg
          # Neon работает на PostgreSQL 18, а в Ubuntu 24.04 лежит клиент 16 —
          # pg_dump 16 отказывается дампить сервер новее себя
          # ("aborting because of server version mismatch"). Ставим клиент 18 из PGDG.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version
          age --version

      - name: Validate inputs
        run: |
          test -n "${{ secrets.DATABASE_URL_PROD }}" || { echo "DATABASE_URL_PROD не задан"; exit 1; }
          test -n "${{ vars.AGE_RECIPIENT_PUBLIC }}" || { echo "AGE_RECIPIENT_PUBLIC не задан"; exit 1; }

      - name: Encrypted logical dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT_PUBLIC }}
        run: |
          set -euo pipefail
          umask 077
          if [ -e "$DEST" ] || [ -L "$DEST" ]; then
            echo "Файл назначения уже существует; отказ перезаписи"; exit 1
          fi
          # В переменной может быть ssh-ed25519 с комментарием: age принимает
          # получателя без хвоста, поэтому оставляем только тип и тело ключа.
          RECIPIENT="$(awk '{print $1" "$2}' <<< "$AGE_RECIPIENT")"
          test -n "$RECIPIENT" || { echo "AGE_RECIPIENT_PUBLIC пуст"; exit 1; }
          export PGCONNECT_TIMEOUT=15
          export PGAPPNAME=windrop-ci-backup
          export PGOPTIONS='-c default_transaction_read_only=on -c lock_timeout=5000'
          # Plaintext никогда не попадает на диск: pipe сразу в age.
          # stderr обеих половин пишем раздельно: иначе причина отказа невидима.
          PG_ERR="$(mktemp)"; AGE_ERR="$(mktemp)"
          if pg_dump --dbname="$DATABASE_URL" --no-password \
              --format=custom --no-owner --no-privileges 2>"$PG_ERR" \
              | age --encrypt --recipient "$RECIPIENT" > "$DEST" 2>"$AGE_ERR"; then
            rm -f "$PG_ERR" "$AGE_ERR"
          else
            rm -f "$DEST"
            echo "Backup не завершён; partial-файл не является резервной копией"
            sed -n '1,15p' "$PG_ERR" | sed 's#//[^@]*@#//***@#g'
            sed -n '1,15p' "$AGE_ERR"
            rm -f "$PG_ERR" "$AGE_ERR"
            exit 1
          fi
          test -s "$DEST"
          echo "dump_bytes=$(stat -c%s "$DEST")" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$DEST" | awk '{print "dump_sha256="$1}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted dump as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Стабильное имя: restore-drill забирает последний артефакт с ним.
          name: windrop-latest
          path: ${{ env.DEST }}
          retention-days: 14
          if-no-files-found: error

      - name: Install rclone
        if: env.R2_BUCKET != ''
        run: |
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.deb -o rclone.deb
          sudo dpkg -i rclone.deb
          rclone version

      - name: Upload to R2
        if: env.R2_BUCKET != ''
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          rclone copyto "$DEST" "R2:${R2_BUCKET}/backups/windrop-$STAMP.dump.age" \
            --s3-no-check-bucket --retries 3 --low-level-retries 5 --timeout 2m
          # Отдельный always-latest объект ускоряет restore-drill.
          rclone copyto "$DEST" "R2:${R2_BUCKET}/backups/windrop-latest.dump.age" \
            --s3-no-check-bucket --retries 3 --low-level-retries 5 --timeout 2m
          echo "Загружено в r2://${R2_BUCKET}/backups/" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply 14-day retention in R2
        if: env.R2_BUCKET != ''
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Удаляет только суффиксные дампы старше 14 суток; windrop-latest не
          # попадает под шаблон и остаётся.
          rclone delete "R2:${R2_BUCKET}/backups/" \
            --s3-no-check-bucket --min-age 14d \
            --exclude "windrop-latest.dump.age"
          rclone lsf "R2:${R2_BUCKET}/backups/" \
            --s3-no-check-bucket | wc -l | awk '{print "дампов_хранится="$1}' >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub runner copy
        if: always()
        run: rm -f "$DEST" || true
