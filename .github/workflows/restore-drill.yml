name: Restore drill (backup verification)

# Дамп без проверки восстановления не является резервной копией. Drill каждую
# неделю скачивает последний дамп (артефакт workflow «Backup PostgreSQL», а если
# R2 настроен и артефакта нет — объект из R2), расшифровывает его и восстанавливает
# во временную БД внутри runner, затем проверяет инварианты ledger/схемы.
# Никогда не пишет в production БД и не читает DATABASE_URL_PROD.
#
# GitHub Secrets: AGE_PRIVATE_KEY (обязательно), R2_* (необязательно)
# GitHub Variables: AGE_RECIPIENT_PUBLIC (не нужен здесь; приватный ключ берётся
#                   из secrets — именно он доказывает, что пара ключей цела)

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres_test:
        # Версия временной БД совпадает с версией Neon: дамп 18 в сервер 16 не входит.
        image: postgres:18
        env:
          POSTGRES_USER: drill_admin
          POSTGRES_PASSWORD: drill-bootstrap-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DUMP: /tmp/windrop-latest.dump
      ENC: /tmp/windrop-latest.dump.age
      DRILL_DB: postgresql://drill_admin:drill-bootstrap-only@127.0.0.1:55432/windrop_drill
    steps:
      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age curl ca-certificates gnupg
          # Дамп снят pg_dump 18 (Neon), поэтому и восстанавливать нужно клиентом
          # 18: pg_restore 16 такой дамп не примет.
          sudo install -d /usr/share/postgresql-common/pgdg
          # Ключ кладём файлом и ссылаемся через signed-by: иначе apt не видит ключ
          # ("NO_PUBKEY 7FCC7D46ACCC4CF8, repository is not signed").
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.deb -o rclone.deb
          sudo dpkg -i rclone.deb
          # /usr/bin/pg_restore и psql остаются врапперами версии 16, поэтому
          # дальше берём бинарники 18 явным путём.
          /usr/lib/postgresql/18/bin/pg_restore --version
          age --version; rclone version

      - name: Download latest dump (artifact first, R2 as fallback)
        env:
          GH_TOKEN: ${{ github.token }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # Основной источник — артефакт workflow «Backup PostgreSQL».
          ARTIFACT_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=windrop-latest&per_page=1" \
            --jq '.artifacts[0].id // empty' 2>/dev/null || true)"
          if [ -n "$ARTIFACT_ID" ] && gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/drill.zip 2>/dev/null; then
            unzip -o -q /tmp/drill.zip -d /tmp/drill && rm -f /tmp/drill.zip
            FOUND="$(find /tmp/drill -name '*.dump.age' -type f | head -1)"
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$ENC"
              echo "источник=артефакт" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Резервный источник: R2, если он настроен.
          if [ ! -s "$ENC" ] && [ -n "${{ secrets.R2_BUCKET }}" ]; then
            rclone copyto "R2:${{ secrets.R2_BUCKET }}/backups/windrop-latest.dump.age" "$ENC" \
              --s3-no-check-bucket --retries 3 --timeout 2m
            echo "источник=r2" >> "$GITHUB_STEP_SUMMARY"
          fi
          test -s "$ENC" || { echo "Не найден ни артефакт бэкапа, ни объект в R2"; exit 1; }
          echo "encrypted_bytes=$(stat -c%s "$ENC")" >> "$GITHUB_STEP_SUMMARY"

      - name: Decrypt
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$AGE_PRIVATE_KEY" > /tmp/age.key
          if ! age --decrypt -i /tmp/age.key "$ENC" > "$DUMP" 2>/dev/null; then
            rm -f /tmp/age.key "$DUMP"
            echo "Расшифровка невозможна: AGE_PRIVATE_KEY не соответствует recipient"
            exit 1
          fi
          rm -f /tmp/age.key
          test -s "$DUMP"
          file "$DUMP" | grep -qi 'PGDUMP\|data' || true

      - name: Create drill database
        env:
          PGPASSWORD: drill-bootstrap-only
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          psql --host=127.0.0.1 --port=55432 --username=drill_admin \
            --dbname=postgres --no-psqlrc --set=ON_ERROR_STOP=1 \
            -c "CREATE DATABASE windrop_drill"

      - name: Restore into temporary database
        env:
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          # Дамп сделан --no-owner --no-privileges; восстановление в чистую БД.
          pg_restore --dbname="$DRILL_DB" --no-owner --no-privileges \
            --exit-on-error --verbose "$DUMP" 2>/tmp/restore.log || {
              tail -40 /tmp/restore.log
              echo "pg_restore завершился ошибкой"; exit 1
            }

      - name: Verify ledger invariant and schema
        env:
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          psql --no-psqlrc --set=ON_ERROR_STOP=1 "$DRILL_DB" <<'SQL'
          \pset footer off
          -- Инвариант reconcile(): баланс = сумма ledger по каждой валюте.
          WITH sums AS (
            SELECT user_id,
                   COALESCE(SUM(delta) FILTER (WHERE currency='units'),0) AS su,
                   COALESCE(SUM(delta) FILTER (WHERE currency='freebets'),0) AS sf
            FROM ledger_entries GROUP BY user_id
          )
          SELECT count(*) AS broken_ledger
          FROM users u
          LEFT JOIN sums s ON s.user_id = u.id
          WHERE COALESCE(s.su,0) != u.balance_units
             OR COALESCE(s.sf,0) != u.balance_freebets;

          SELECT count(*) AS migrations_rows FROM schema_migrations;
          SELECT count(*) AS has_expected_migration
          FROM schema_migrations WHERE filename = '0018_giftcard_redemption.sql';
          SELECT count(*) AS users FROM users;
          SELECT count(*) AS ledger FROM ledger_entries;
          SELECT count(*) AS bot_registry FROM bot_registry;
          SELECT count(*) AS inbox FROM bot_inbox;
          SELECT count(*) AS outbox FROM bot_outbox;
          SQL

      - name: Fail loudly on broken invariant
        env:
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          BROKEN=$(psql --no-psqlrc -tA "$DRILL_DB" -c "
            WITH sums AS (
              SELECT user_id,
                     COALESCE(SUM(delta) FILTER (WHERE currency='units'),0) AS su,
                     COALESCE(SUM(delta) FILTER (WHERE currency='freebets'),0) AS sf
              FROM ledger_entries GROUP BY user_id
            )
            SELECT count(*) FROM users u
            LEFT JOIN sums s ON s.user_id = u.id
            WHERE COALESCE(s.su,0) != u.balance_units
               OR COALESCE(s.sf,0) != u.balance_freebets;")
          MIG=$(psql --no-psqlrc -tA "$DRILL_DB" -c "
            SELECT count(*) FROM schema_migrations
            WHERE filename='0018_giftcard_redemption.sql';")
          echo "broken_ledger=$BROKEN expected_migration=$MIG" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BROKEN" != "0" ]; then
            echo "Инвариант ledger нарушен в восстановленной копии: $BROKEN пользователей"; exit 1
          fi
          if [ "$MIG" != "1" ]; then
            echo "Ожидаемая миграция 0018 отсутствует в дампе"; exit 1
          fi
          echo "Restore drill: дамп восстанавливается и инварианты целы" >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub runner copies
        if: always()
        run: rm -f "$DUMP" "$ENC" /tmp/restore.log /tmp/age.key || true
