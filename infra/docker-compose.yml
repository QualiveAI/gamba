services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caseplatform
      POSTGRES_PASSWORD: caseplatform
      POSTGRES_DB: caseplatform
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseplatform -d caseplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://caseplatform:caseplatform@db:5432/caseplatform
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://caseplatform:caseplatform@db:5432/caseplatform
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      backend:
        condition: service_healthy

  healthcheck-bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://caseplatform:caseplatform@db:5432/caseplatform
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.bot.healthcheck"]
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend

volumes:
  pgdata: